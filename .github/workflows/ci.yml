name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium mysql-connector-python python-dotenv

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile src/crawler.py
          python -m py_compile src/transform.py
          python -m py_compile src/quality.py
          python -m py_compile src/database.py